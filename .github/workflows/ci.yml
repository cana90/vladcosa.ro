name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Verifică sursele
        uses: actions/checkout@v4

      - name: Configurează Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalează dependențele
        run: npm ci

      - name: Verifică linting-ul
        run: npm run lint

      - name: Construiește proiectul
        run: npm run build
