services:
  vladcosa-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vladcosa-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_PATH: ${DB_PATH:-/app/data/blog.db}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/data/uploads}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - blog-data:/app/data
    networks:
      - vladcosa-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vladcosa-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vladcosa-psychology
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      vladcosa-api:
        condition: service_healthy
    networks:
      - vladcosa-network
    labels:
      # For Nginx Proxy Manager / Traefik
      - "traefik.enable=true"
      - "traefik.http.routers.vladcosa.rule=Host(`vladcosa.ro`) || Host(`www.vladcosa.ro`)"
      - "traefik.http.routers.vladcosa.entrypoints=websecure"
      - "traefik.http.routers.vladcosa.tls.certresolver=letsencrypt"
      - "traefik.http.services.vladcosa.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  vladcosa-network:
    driver: bridge

volumes:
  blog-data:
